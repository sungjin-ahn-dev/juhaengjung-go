# 이 PC(i9-14900KF)에서 Gradle 데몬 JVM이 JIT(C2)·R8 중에 크래시했다(hs_err: ciMethodData ShouldNotReachHere, EXCEPTION_ACCESS_VIOLATION, jvm.dll).
# C1만 쓰고(TieredStopAtLevel=1) 병렬을 줄이면(코어 4개·워커 4개) 느려도 끝까지 간다. 다른 PC에서는 지워도 된다.
org.gradle.jvmargs=-Xmx4g -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -XX:ActiveProcessorCount=4 -XX:CICompilerCount=1 -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=false
# Kotlin 컴파일도 같은 JVM 설정 안에서(별도 Kotlin 데몬의 JIT 크래시 회피)
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official

# Windows 사용자 폴더 이름이 한글이면 AGP가 경로 검사로 빌드를 막는다 → 검사 생략(빌드 자체는 동작)
android.overridePathCheck=true
