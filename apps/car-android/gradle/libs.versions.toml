# 버전은 멀미예보(MotionCast) 차량 앱과 같게 맞췄다. Pleos 환경(API 34) 기준.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.13.1"   # 1.15는 compileSdk 35 필요 → API 34에 맞춰 1.13.1
activity = "1.9.3"
webkit = "1.11.0"
coroutines = "1.9.0"
pleosVehicle = "2.3.2"
pleosNaviHelper = "3.0.5"
pleosTts = "3.3.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
pleos-vehicle = { group = "ai.pleos.playground", name = "Vehicle", version.ref = "pleosVehicle" }
pleos-navihelper = { group = "ai.pleos.playground", name = "NaviHelper", version.ref = "pleosNaviHelper" }
pleos-tts = { group = "ai.pleos.playground", name = "TextToSpeech", version.ref = "pleosTts" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
